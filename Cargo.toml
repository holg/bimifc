[workspace]
resolver = "2"
members = [
    "crates/bimifc-bevy",
    "crates/bimifc-egui",
    "crates/bimifc-federation",
    "crates/bimifc-ffi",
    "crates/bimifc-geometry",
    "crates/bimifc-leptos",
    "crates/bimifc-lisp",
    "crates/bimifc-model",
    "crates/bimifc-parser",
    "crates/bimifc-python",
    "crates/bimifc-viewer",
    "crates/bimifc-viewer-tui",
    "crates/bimifc-writer",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
repository = "https://github.com/holg/bimifc"
authors = ["holg"]

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Local development against the sibling checkouts (eulumdat-rs, gldf-rs,
# l3d-rs beside bimifc): every crate in the graph uses these instead of the
# crates.io versions. Keep this section LAST: CI deletes everything from
# here on ("Remove patch section" in .github/workflows/ci.yml) and builds
# against crates.io.
[patch.crates-io]
eulumdat = { path = "../eulumdat-rs/crates/eulumdat" }
gldf-rs = { path = "../gldf-rs/crates/gldf-rs-lib" }
l3d_rs = { path = "../l3d-rs/crates/l3d_rs" }
