[package]
name = "bimifc-leptos"
version = "0.3.0"
edition = "2021"
description = "Leptos-based UI components for BIM IFC viewer"
license = "MPL-2.0"
repository = "https://github.com/holg/bimifc"
keywords = ["ifc", "bim", "leptos", "wasm"]
categories = ["wasm", "gui"]

[lib]
name = "bimifc_leptos"
path = "src/lib.rs"

[features]
default = []
# Enable unified mode - direct memory sharing with Bevy (no serialization)
unified = ["bimifc-bevy"]
# Photometric lighting passthrough
photometric = ["bimifc-bevy/photometric"]

[dependencies]
acadlisp = { version = "0.2.0", path = "../../../acadlisp" }
bimifc-geometry = { version = "0.3.0", path = "../bimifc-geometry" }
# AutoLISP scripting with IFC functions
bimifc-lisp = { version = "0.2.0", path = "../bimifc-lisp" }
# Core IFC parsing (our own parser)
bimifc-model = { version = "0.3.0", path = "../bimifc-model" }
bimifc-parser = { version = "0.3.0", path = "../bimifc-parser" }

# Photometric data parsing and SVG diagram generation
eulumdat = { version = "0.5", default-features = false }

# Bevy types for unified mode (optional)
bimifc-bevy = { version = "0.3.0", path = "../bimifc-bevy", optional = true, default-features = false }

# Leptos framework
leptos = { version = "0.7", features = ["csr"] }

# WASM utilities
gloo = "0.11"
gloo-file = { version = "0.3", features = ["futures"] }
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3.91"
wasm-bindgen = "0.2.114"
wasm-bindgen-futures = "0.4.64"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Fast hashing
rustc-hash = "1.1"

# Logging
log = "0.4"

# Base64 for binary data
base64 = "0.22"

# Zero-copy byte casting
bytemuck = { version = "1.14", features = ["derive"] }

[dependencies.web-sys]
version = "0.3.91"
features = [
    "Clipboard",
    "console",
    "Document",
    "DragEvent",
    "DataTransfer",
    "Element",
    "Event",
    "EventTarget",
    "File",
    "FileList",
    "FileReader",
    "Headers",
    "HtmlCanvasElement",
    "HtmlDivElement",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlSelectElement",
    "KeyboardEvent",
    "Location",
    "MouseEvent",
    "Navigator",
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
    "ScrollBehavior",
    "Storage",
    "Url",
    "UrlSearchParams",
    "WheelEvent",
    "Window",
]

# Workaround for uuid 1.x rng on wasm32-unknown-unknown.
#
# bimifc-writer transitively pulls uuid for v4 GUID generation. The uuid
# crate refuses to compile for wasm32-unknown-unknown unless one of `js`,
# `rng-getrandom`, or `rng-rand` is enabled — and feature unification means
# enabling it at any point in the dep graph fixes the whole tree. The fix
# lives here (not in bimifc-writer) so native builds of bimifc-writer don't
# pay for a JS-only feature they don't need.
[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { version = "1", features = ["js"] }
