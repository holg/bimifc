[package]
name = "bimifc-writer"
version = "0.3.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "IFC 2x3 STEP file writer — generates IFC from room geometry data"
keywords = ["ifc", "bim", "step", "writer", "building"]
categories = ["encoding", "data-structures"]

[dependencies]
chrono = "0.4"
uuid = { version = "1", features = ["v4", "v5"] }

[dev-dependencies]
bimifc-model = { version = "0.3.1", path = "../bimifc-model" }
bimifc-parser = { version = "0.3.1", path = "../bimifc-parser" }
bimifc-geometry = { version = "0.3.1", path = "../bimifc-geometry" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
