[package]
name = "bimifc-writer"
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "IFC 2x3 STEP file writer — generates IFC from room geometry data"

[dependencies]
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
bimifc-model = { version = "0.2.0", path = "../bimifc-model" }
bimifc-parser = { version = "0.2.0", path = "../bimifc-parser" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
