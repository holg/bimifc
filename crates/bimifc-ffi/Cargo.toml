[package]
name = "bimifc-ffi"
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "UniFFI bindings for bimifc — for macOS/iOS Swift integration"

[lib]
name = "bimifc_ffi"
crate-type = ["staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
bimifc-geometry = { version = "0.2.0", path = "../bimifc-geometry" }
bimifc-model = { version = "0.2.0", path = "../bimifc-model" }
bimifc-parser = { version = "0.2.0", path = "../bimifc-parser" }
bimifc-writer = { version = "0.2.0", path = "../bimifc-writer" }
thiserror = "2"
uniffi = { version = "0.29", features = ["cli"] }

[build-dependencies]
uniffi = { version = "0.29", features = ["build"] }
